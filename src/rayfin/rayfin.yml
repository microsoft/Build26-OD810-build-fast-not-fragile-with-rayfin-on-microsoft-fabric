id: contoso-chef
name: Contoso Chef
version: 1.0.0
services:
  auth:
    enabled: true
    expiryInMinutes: 60
    refreshToken:
      lifetimeInDays: 30
    allowedRedirectUris:
      - http://localhost:5173
      - http://localhost:5173/auth/callback
      - https://avid-dune-700597304a-centraluseuap.webapp.dxt.fabricapps.net
      - https://avid-dune-700597304a-centraluseuap.webapp.dxt.fabricapps.net/auth/callback
    fabric:
      enabled: true
  data:
    enabled: true
    dialect: mssql
  storage:
    enabled: true
  staticHosting:
    enabled: true
    root: .
    folder: dist
    buildCommand: npm run build:fabric
    indexDocument: index.html
